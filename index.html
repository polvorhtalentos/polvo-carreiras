<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Vagas abertas e banco de talentos da POLVO Consultoria de Carreira.">
<title>Carreiras POLVO</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap">
<style>
/* Layout claro e limpo: fundo Papel/branco, texto Tinta, lavanda como cor de marca e laranja só nos botões de ação. Montserrat. */
:root{--bg:#FFFFFF;--soft:#F9F8FB;--soft2:#F2F0F8;--tinta:#13111B;--papel:#13111B;--nevoa:#4E495C;--cinza:#6E6880;--bd:#E6E3EE;--bd2:#D6D1E4;--lav:#9C90D4;--lavd:#5F5299;--lavm:#7D70B0;--lar:#F2A13A;--al:#C93A3A;--font:'Montserrat','Segoe UI',system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tinta);font-family:var(--font);font-weight:500;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
a{color:var(--lavd)}
:focus-visible{outline:2px solid var(--lavm);outline-offset:3px}
.in-w{max-width:1140px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd)}
header.top .in-w{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:68px}
.logo{font-weight:900;letter-spacing:.35em;font-size:21px;display:inline-flex;align-items:baseline;color:var(--tinta);text-decoration:none;white-space:nowrap}
.logo svg{width:.8em;height:.7em;margin-right:.35em;fill:var(--lavm)}
.logo small{font-size:10px;letter-spacing:.22em;color:var(--lavd);margin-left:10px;font-weight:800}
nav.links{display:flex;gap:4px;align-items:center}
nav.links a{color:var(--nevoa);text-decoration:none;font-weight:700;font-size:14px;padding:8px 12px;border-radius:999px}
nav.links a:hover{color:var(--tinta);background:var(--soft2)}
.pill-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;border-radius:60px;border:1.5px solid var(--tinta);background:transparent;color:var(--tinta);font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-size:13px;text-decoration:none;cursor:pointer;font-family:var(--font);transition:background .15s}
.pill-btn:hover{background:var(--soft2)}
.pill-btn.go{background:var(--lar);border-color:var(--lar);color:var(--tinta)}
.pill-btn.go:hover{background:#E8952B;border-color:#E8952B}
nav.links a.pill-btn.go{color:var(--tinta)}
.pill-btn[disabled]{opacity:.5;cursor:not-allowed}
/* Herói */
.hero{position:relative;overflow:hidden;padding-block:84px 64px;background:var(--soft);border-bottom:1px solid var(--bd)}
.hero::before{content:"";position:absolute;width:520px;height:520px;right:-140px;top:-180px;border-radius:50%;background:radial-gradient(rgba(156,144,212,.28),transparent 68%);pointer-events:none}
.stripes{position:absolute;right:0;bottom:0;width:220px;height:140px;background:repeating-linear-gradient(135deg,#9C90D4 0 3px,transparent 3px 18px);opacity:.35;pointer-events:none;-webkit-mask:linear-gradient(225deg,#000,transparent 75%);mask:linear-gradient(225deg,#000,transparent 75%)}
.hero .in-w{position:relative;z-index:1}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:12px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--lavd);margin-bottom:16px}
.eyebrow::before{content:"";width:22px;height:3px;border-radius:2px;background:var(--lar)}
h1{font-size:clamp(36px,6vw,76px);line-height:1;font-weight:900;letter-spacing:-.025em;text-transform:uppercase;margin:0 0 20px;max-width:15ch;text-wrap:balance;color:var(--tinta)}
h1 em{font-style:normal;color:var(--lavm)}
h1.h-home{font-size:clamp(30px,4.6vw,60px);line-height:1.04;max-width:22ch}
h1.h-home a{color:var(--lavm);text-decoration:underline;text-decoration-thickness:.07em;text-underline-offset:.12em}
.lead{font-size:clamp(17px,1.5vw,19px);color:var(--nevoa);max-width:58ch;margin:0 0 30px}
.search{display:grid;grid-template-columns:minmax(0,2fr) repeat(3,minmax(0,1fr));gap:8px;background:var(--bg);border:1px solid var(--bd);border-radius:20px;padding:8px;max-width:980px;box-shadow:0 10px 30px -18px rgba(19,17,27,.25)}
.search input,.search select{width:100%;padding:13px 15px;border-radius:14px;border:1px solid transparent;background:var(--soft);color:var(--tinta);font:inherit;font-size:15px}
.search input:focus,.search select:focus{outline:none;border-color:var(--lav);background:var(--bg)}
/* Seções */
section.block{padding-block:64px}
section.block + section.block{border-top:1px solid var(--bd)}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:26px}
h2{font-size:clamp(24px,3vw,36px);font-weight:900;text-transform:uppercase;letter-spacing:-.015em;line-height:1.08;margin:0;text-wrap:balance;color:var(--tinta)}
.count{color:var(--cinza);font-weight:700;font-size:14px}
.jobs{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr))}
.job{display:flex;flex-direction:column;gap:12px;padding:28px;border-radius:22px;border:1px solid var(--bd);background:var(--bg);color:inherit;text-decoration:none;transition:transform .15s,border-color .15s,box-shadow .15s}
.job:hover{transform:translateY(-2px);border-color:var(--lav);box-shadow:0 16px 36px -22px rgba(95,82,153,.45)}
.job.feat{background:var(--soft2);border-color:var(--bd2)}
.job .area{font-size:11.5px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--lavd)}
.job h3{font-size:22px;font-weight:900;line-height:1.18;margin:0;letter-spacing:-.01em;color:var(--tinta)}
.job p{margin:0;color:var(--nevoa);font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:5px 11px;border-radius:999px;background:var(--soft);border:1px solid var(--bd);font-size:12.5px;font-weight:700;color:var(--nevoa)}
.job .more{margin-top:auto;padding-top:6px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;font-size:12.5px;color:var(--lavd);display:flex;align-items:center;gap:8px}
.empty{padding:40px;border:1.5px dashed var(--bd2);border-radius:22px;text-align:center;color:var(--nevoa)}
.values{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}
.val{padding:26px;border-radius:22px;background:var(--soft);border:1px solid var(--bd)}
.val b{display:inline-flex;width:36px;height:36px;border-radius:50%;background:var(--tinta);color:#fff;align-items:center;justify-content:center;font-weight:900;font-size:14px;margin-bottom:14px}
.val h3{margin:0 0 8px;font-size:16px;font-weight:900;text-transform:uppercase;letter-spacing:.02em}
.val p{margin:0;color:var(--nevoa);font-size:15px}
/* Página da vaga */
.vhero{padding-block:52px 40px;position:relative;overflow:hidden;background:var(--soft);border-bottom:1px solid var(--bd)}
.vhero::before{content:"";position:absolute;width:460px;height:460px;right:-140px;top:-200px;border-radius:50%;background:radial-gradient(rgba(156,144,212,.26),transparent 68%);pointer-events:none}
.vhero .in-w{position:relative}
.back{display:flex;width:max-content;align-items:center;gap:8px;color:var(--nevoa);text-decoration:none;font-weight:700;font-size:14px;margin-bottom:22px}
.back:hover{color:var(--tinta)}
.vhero h1{font-size:clamp(32px,4.6vw,58px);max-width:20ch}
.vgrid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:48px;padding-block:48px 80px;align-items:start}
.vcol h2{font-size:18px;margin:36px 0 12px;letter-spacing:.02em}
.vcol h2:first-child{margin-top:0}
.vcol p{color:var(--nevoa);margin:0 0 12px}
.vcol ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.vcol li{display:flex;gap:12px;color:var(--nevoa)}
.vcol li::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--lavm);flex:none;margin-top:9px}
.steps{display:flex;flex-direction:column;gap:12px;counter-reset:s}
.steps div{display:flex;gap:14px;align-items:center;color:var(--nevoa)}
.steps div::before{counter-increment:s;content:counter(s);width:30px;height:30px;border-radius:50%;background:var(--soft2);border:1px solid var(--bd2);color:var(--lavd);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;flex:none}
aside.apply{position:sticky;top:92px;padding:26px;border-radius:22px;border:1px solid var(--bd);background:var(--bg);box-shadow:0 18px 40px -26px rgba(19,17,27,.3);display:flex;flex-direction:column;gap:14px}
aside.apply dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:14px}
aside.apply dt{color:var(--cinza);font-weight:700}
aside.apply dd{margin:0;font-weight:700;color:var(--tinta)}
/* Formulário */
.form-wrap{border-top:1px solid var(--bd);padding-block:60px 90px;background:var(--soft)}
form.app{max-width:820px;display:flex;flex-direction:column;gap:20px}
fieldset{border:1px solid var(--bd);border-radius:22px;padding:26px;margin:0;background:var(--bg)}
legend{padding:0 10px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;font-size:13px;color:var(--lavd)}
.fg{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.fg .wide{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700;color:var(--tinta);min-width:0}
.req{color:#C2410C}
.hint{font-size:12.5px;color:var(--cinza);font-weight:500}
.in{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--bd2);background:var(--bg);color:var(--tinta);font:inherit;font-size:15px;transition:border-color .15s,box-shadow .15s}
.in::placeholder{color:#9A95A8}
textarea.in{min-height:130px;resize:vertical}
.in:focus{outline:none;border-color:var(--lavm);box-shadow:0 0 0 3px rgba(156,144,212,.25)}
.in.err,.drop.err{border-color:var(--al)}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.ck{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;border:1px solid var(--bd2);background:var(--bg);cursor:pointer;font-weight:700;font-size:14px;color:var(--tinta)}
.ck input{accent-color:var(--lavm);width:16px;height:16px;margin:0}
.ck:has(input:checked){border-color:var(--lavm);background:var(--soft2)}
.drop{position:relative;border:1.5px dashed var(--bd2);border-radius:16px;padding:26px;text-align:center;background:var(--soft);cursor:pointer;color:var(--tinta)}
.drop:hover{border-color:var(--lavm)}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.drop b{display:block;font-size:15px;margin-bottom:4px}
.drop.ok{border-style:solid;border-color:var(--lavm);background:var(--soft2)}
.consent{display:flex;gap:12px;align-items:flex-start;font-size:14px;color:var(--nevoa)}
.consent input{width:18px;height:18px;margin-top:3px;accent-color:var(--lavm);flex:none}
.msg{color:var(--al);font-weight:700;font-size:14px;min-height:20px}
.send{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));margin:20px 0}
.code{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;white-space:pre-wrap;word-break:break-word;background:var(--bg);border:1px dashed var(--bd2);border-radius:14px;padding:16px;max-height:220px;overflow:auto;color:var(--tinta)}
.done{max-width:820px;background:var(--bg);border:1px solid var(--bd);border-radius:22px;padding:32px}
.done h2{margin-bottom:14px}
.done p{color:var(--nevoa)}
.note{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:14px;background:#FFF6E8;border:1px solid #F5CF94;color:var(--tinta);font-weight:600}
footer{border-top:1px solid var(--bd);padding-block:32px calc(32px + env(safe-area-inset-bottom,0px));color:var(--cinza);font-size:14px;background:var(--bg)}
footer .in-w{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center}
@media (max-width:900px){.vgrid{grid-template-columns:minmax(0,1fr);gap:32px}aside.apply{position:static;order:-1}.search{grid-template-columns:1fr 1fr}.search input{grid-column:1/-1}}
@media (max-width:560px){nav.links a.hide-sm{display:none}.hero{padding-block:52px 44px}.job{padding:22px}fieldset{padding:20px 16px}.done{padding:22px 18px}.search{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.job{transition:none}}
</style>
</head><body>
<header class="top"><div class="in-w"><a class="logo" href="#inicio" aria-label="POLVO · Carreiras">POL<svg viewBox="0 0 100 88" aria-hidden="true"><path d="M0 0H100L50 88Z"/></svg>O<small>CARREIRAS</small></a>
<nav class="links" aria-label="Navegação"><a href="#vagas" class="hide-sm">Vagas</a><a href="#vaga-banco-de-talentos" class="hide-sm">Banco de talentos</a><a href="#vagas" class="pill-btn go" style="padding:10px 18px">Ver vagas</a></nav></div></header>
<main id="app"></main>
<footer><div class="in-w"><span>POLVO Consultoria de Carreira · Seus dados são tratados de acordo com a LGPD (Lei 13.709/2018).</span><span>Dúvidas: <span style="color:var(--papel);user-select:all">polvorh.talentos@gmail.com</span></span></div></footer>
<script>
"use strict";
const DEST = "polvorh.talentos@gmail.com";
/* Envio automático (FormSubmit). Depois de ativar, troque FS_ID pelo código aleatório que a FormSubmit envia, para esconder o e-mail. */
const FS_ID = DEST;
let ENVIO = "";
const EMPRESA = "POLVO";
const SOBRE = "A POLVO é uma consultoria de carreira que conecta profissionais a vagas em empresas que atuam de forma inclusiva. A gente une recrutamento, desenvolvimento e dados para aproximar cada pessoa de um lugar onde ela possa ser quem é e crescer, com um processo humano, transparente e sem enrolação.";
const VAGAS = [
  { id: "teste-analista-financeiro-pl", titulo: "Analista Financeiro Pleno", area: "Financeiro", senioridade: "Pleno", local: "São Paulo, SP", modelo: "Híbrido", regime: "CLT", faixa: "R$ 7.000 a R$ 9.500",
    resumo: "Responder pela rotina de contas a pagar e a receber, conciliações bancárias e apoio ao fechamento mensal de uma operação com vários CNPJs.",
    descricao: ["Você vai responder pela rotina de contas a pagar e a receber, pelas conciliações bancárias e pelo apoio ao fechamento mensal de uma operação com vários CNPJs.", "É uma posição para quem gosta de organização, de números que fecham e de melhorar processos no dia a dia."],
    atividades: ["Conduzir a rotina de contas a pagar e a receber", "Fazer as conciliações bancárias", "Apoiar o fechamento mensal", "Organizar controles e relatórios em Excel", "Lançar e acompanhar movimentações no ERP"],
    requisitos: ["Contas a pagar e a receber como rotina principal", "Conciliação bancária", "Excel avançado (PROCV, tabela dinâmica)", "Fechamento mensal", "ERP (SAP, TOTVS ou similar)"],
    beneficios: ["Modelo híbrido", "Contratação CLT", "Faixa salarial informada desde o início"],
    etapas: ["Candidatura e triagem", "Entrevista com o RH", "Entrevista com a gestão", "Teste ou case", "Proposta"] },
  { id: "banco-de-talentos", titulo: "Banco de Talentos", area: "Todas as áreas", senioridade: "Todos os níveis", local: "Brasil", modelo: "Presencial, híbrido ou remoto", regime: "CLT, PJ ou estágio", fixa: true,
    resumo: "Não encontrou a vaga ideal? Deixe seu currículo e a gente te chama quando surgir uma oportunidade com o seu perfil.",
    descricao: ["O Banco de Talentos da POLVO é a porta sempre aberta para quem quer ser lembrado nas próximas oportunidades.", "Cada candidatura é lida por uma pessoa do nosso time. Quando abrir uma vaga com o seu perfil, você é uma das primeiras pessoas que a gente procura."],
    atividades: [], requisitos: ["Currículo atualizado", "Vontade de crescer e de contar sua trajetória com clareza"],
    beneficios: ["Seu perfil fica disponível para todas as vagas que abrirmos", "Retorno quando houver uma oportunidade aderente"],
    etapas: ["Candidatura", "Leitura do currículo pelo time", "Contato quando surgir uma vaga com o seu perfil"] }
];
const AREAS = ["Administrativo", "Atendimento ao cliente", "Comercial e vendas", "Criação e design", "Dados e BI", "Financeiro", "Jurídico", "Logística e operações", "Marketing e comunicação", "Pessoas e RH", "Produto e projetos", "Tecnologia", "Outra"];
const UFS = "AC AL AP AM BA CE DF ES GO MA MT MS MG PA PB PR PE PI RJ RN RS RO RR SC SP SE TO".split(" ");
const TRI = '<svg viewBox="0 0 100 88" aria-hidden="true"><path d="M0 0H100L50 88Z"/></svg>';
const e = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const norm = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const app = document.getElementById("app");
let F = { q: "", area: "", modelo: "", local: "" };

/* ---------- Lista ---------- */
function listHTML() {
  const q = norm(F.q);
  const vs = VAGAS.filter(v => (!q || norm([v.titulo, v.area, v.resumo, v.local].join(" ")).includes(q)) && (!F.area || v.area === F.area || v.fixa) && (!F.modelo || norm(v.modelo).includes(norm(F.modelo))) && (!F.local || norm(v.local).includes(norm(F.local)) || v.fixa));
  const opt = (arr, val, lbl) => `<option value="">${lbl}</option>` + arr.map(x => `<option${x === val ? " selected" : ""}>${e(x)}</option>`).join("");
  const abertas = VAGAS.filter(v => !v.fixa).length;
  return `<section class="hero" id="inicio"><div class="stripes"></div><div class="in-w"><div class="eyebrow">Carreiras POLVO</div>
   <h1 class="h-home">Vem fazer parte do <a href="#vaga-banco-de-talentos">banco de talentos da POLVO</a> e se torne um(a) candidato(a) <em>Polver</em>.</h1>
   <p class="lead">${e(SOBRE)} Veja as vagas abertas ou entre no nosso Banco de Talentos.</p>
   <div class="search" role="search"><input id="q" placeholder="Buscar por cargo, área ou palavra-chave" value="${e(F.q)}" aria-label="Buscar vagas">
    <select id="fa" aria-label="Área">${opt([...new Set(VAGAS.filter(v => !v.fixa).map(v => v.area))], F.area, "Todas as áreas")}</select>
    <select id="fm" aria-label="Modelo de trabalho">${opt(["Presencial", "Híbrido", "Remoto"], F.modelo, "Qualquer modelo")}</select>
    <select id="fl" aria-label="Local">${opt([...new Set(VAGAS.filter(v => !v.fixa).map(v => v.local))], F.local, "Todos os locais")}</select></div></div></section>
  <section class="block" id="vagas"><div class="in-w"><div class="sec-head"><h2>Vagas abertas</h2><span class="count">${abertas} ${abertas === 1 ? "vaga" : "vagas"} + Banco de Talentos</span></div>
   ${vs.length ? `<div class="jobs">${vs.map(v => `<a class="job ${v.fixa ? "feat" : ""}" href="#vaga-${v.id}"><span class="area">${v.fixa ? "Sempre aberta" : e(v.area)}</span><h3>${e(v.titulo)}</h3><p>${e(v.resumo)}</p>
     <div class="chips">${[v.fixa ? null : v.senioridade, v.local, v.modelo, v.regime].filter(Boolean).map(c => `<span class="chip">${e(c)}</span>`).join("")}</div><span class="more">${v.fixa ? "Deixar meu currículo" : "Ver vaga"} →</span></a>`).join("")}</div>`
     : `<div class="empty">Nenhuma vaga com esses filtros. Que tal o <a href="#vaga-banco-de-talentos">Banco de Talentos</a>?</div>`}</div></section>
  <section class="block" style="padding-top:12px"><div class="in-w"><div class="sec-head"><h2>Como é o nosso processo</h2></div><div class="values">
   <div class="val"><b>1</b><h3>Gente lendo gente</h3><p>Cada candidatura é lida por uma pessoa do time. Sem filtro por foto, idade ou faculdade.</p></div>
   <div class="val"><b>2</b><h3>Transparência</h3><p>Faixa e etapas informadas desde o início. Você sabe onde está no processo.</p></div>
   <div class="val"><b>3</b><h3>Retorno sempre</h3><p>Avançando ou não, você recebe uma devolutiva. Respeito pelo seu tempo é regra.</p></div></div></div></section>`;
}
/* ---------- Página da vaga ---------- */
function vagaHTML(v) {
  const li = a => `<ul>${a.map(x => `<li>${e(x)}</li>`).join("")}</ul>`;
  return `<section class="vhero"><div class="in-w"><a class="back" href="#vagas">← Todas as vagas</a><div class="eyebrow">${v.fixa ? "Sempre aberta" : e(v.area) + " · " + e(v.senioridade)}</div><h1>${e(v.titulo)}</h1>
