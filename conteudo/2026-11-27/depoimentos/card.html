<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<!-- Cards de depoimento POLVO RH · versão clean (branco + lilás, pedido do Bruno em 27/11).
     ?f=li → LinkedIn 1080×1350 · ?f=st → stories 1080×1920 (conteúdo entre y 260 e 1600)
     ?i=0 capa · 1..5 depoimentos · 6 chamada final -->
<style>
:root{--branco:#FFFFFF;--nevoa:#F6F4FC;--lilas-claro:#ECE8F8;--lilas:#9C90D4;--lilas-esc:#6E61A8;--tinta:#13111B;--texto2:#5F5A70;--linha:#DCD6F0}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Montserrat,sans-serif;color:var(--tinta);background:var(--branco);-webkit-font-smoothing:antialiased;overflow:hidden}
#c{position:relative;overflow:hidden;background:var(--branco)}
.blob{position:absolute;right:-260px;top:-260px;width:820px;height:820px;border-radius:50%;background:radial-gradient(circle,var(--lilas-claro) 0%,rgba(236,232,248,0) 68%)}
.blob2{position:absolute;left:-300px;bottom:-320px;width:760px;height:760px;border-radius:50%;background:radial-gradient(circle,#F3F0FB 0%,rgba(243,240,251,0) 68%)}
.pontos{position:absolute;right:70px;bottom:150px;width:220px;height:220px;background-image:radial-gradient(var(--linha) 3px,transparent 3.5px);background-size:28px 28px}
.logo{position:absolute;left:80px;font-weight:900;font-size:34px;letter-spacing:.35em;color:var(--lilas-esc);display:flex;align-items:baseline;line-height:1}
.logo svg{height:.7em;width:.8em;margin-right:.35em;fill:currentColor}
.counter{position:absolute;right:80px;font-weight:800;font-size:28px;letter-spacing:.14em;color:var(--lilas)}
.rodape{position:absolute;left:80px;right:80px;display:flex;align-items:center;gap:24px}
.rodape i{flex:1;height:3px;background:var(--linha);border-radius:3px}
.rodape span{font-weight:800;font-size:28px;letter-spacing:.12em;color:var(--lilas-esc);display:flex;align-items:baseline}
.cont{position:absolute;left:80px;right:80px;display:flex;flex-direction:column;justify-content:center}
.label{font-weight:800;font-size:28px;letter-spacing:.22em;color:var(--lilas-esc);margin-bottom:26px}
h1{font-weight:900;font-size:88px;line-height:1.04;letter-spacing:-.025em;text-wrap:balance}
h1 em{font-style:normal;color:var(--lilas-esc)}
.sub{font-weight:600;font-size:38px;line-height:1.3;color:var(--texto2);margin-top:28px}
.foto{border-radius:50%;background-size:cover;background-position:center;box-shadow:0 0 0 8px var(--branco),0 0 0 14px var(--lilas)}
.topo-dep{display:flex;align-items:center;gap:30px;margin-bottom:46px}
.ctx{display:inline-block;border-radius:60px;background:var(--lilas-claro);color:var(--lilas-esc);padding:12px 26px;font-weight:800;font-size:26px;letter-spacing:.12em}
.aspas{font-family:Georgia,serif;font-weight:700;font-size:200px;line-height:.5;color:var(--lilas);height:80px;margin-bottom:8px}
.quote{font-weight:700;font-size:var(--qf,50px);line-height:1.3;letter-spacing:-.01em;text-wrap:pretty}
.quote b{color:var(--lilas-esc);font-weight:900}
.nome{font-weight:900;font-size:40px;margin-top:46px}
.cargo{font-weight:600;font-size:30px;color:var(--texto2);margin-top:8px;line-height:1.3}
.fotos{display:flex;margin-top:56px}
.fotos .foto{width:150px;height:150px;margin-right:-26px}
.painel{border-radius:40px;background:var(--lilas);color:var(--tinta);padding:56px 56px}
.painel h1{font-size:var(--pf,70px)}
.lista{display:flex;flex-direction:column;gap:18px;margin-top:38px}
.item{display:flex;align-items:center;gap:22px;font-weight:800;font-size:var(--lf,36px);line-height:1.2}
.chk{flex:0 0 58px;height:58px;border-radius:50%;background:var(--tinta);display:flex;align-items:center;justify-content:center}
.pill{display:inline-block;border-radius:60px;background:var(--tinta);color:var(--branco);padding:22px 40px;font-weight:900;font-size:34px;letter-spacing:.05em;margin-top:42px}
.assina{font-weight:700;font-size:28px;color:var(--texto2);margin-top:30px;letter-spacing:.06em}
</style></head>
<body><div id="c"></div>
<script>
const q=new URLSearchParams(location.search);const F=q.get('f')||'li';const I=+(q.get('i')||0);const A=q.get('a')||'polvo';const N=6;
const W=1080,H=F==='st'?1920:1350;
const D=[
 {foto:'fotos/luanna.jpg',nome:'Luanna Siqueira',cargo:'Coordenadora Educacional · Impacto Social',ctx:'PROCESSO SELETIVO',
  q:'Uma das experiências <b>mais empáticas e cuidadosas</b> que vivenciei. Me senti acolhida em todo o processo, com segurança em cada etapa.'},
 {foto:'fotos/luisa.jpg',nome:'Luisa Ribeiro',cargo:'HR Business Partner & Talent Acquisition',ctx:'PROCESSO SELETIVO',
  q:'Atencioso, claro e preciso em todas as etapas. <b>Feedbacks construtivos e claros</b> durante todo o processo.'},
 {foto:'fotos/rariany.jpg',nome:'Rariany Monteiro',cargo:'Senior Economist · hoje no WWF-Brasil',ctx:'HEADHUNTING',
  q:'Um raro comprometimento em conectar pessoas a oportunidades alinhadas <b>não só com suas competências, mas também com seus propósitos.</b>'},
 {foto:'fotos/luana.jpg',nome:'Luana Oliveira',cargo:'Engenheira Civil · Gerenciamento de obras',ctx:'CONSULTORIA DE RH',
  q:'Sua contribuição foi essencial para <b>fortalecer a cultura organizacional</b> e melhorar os processos de gestão de pessoas.'},
];
const TRI='<svg viewBox="0 0 100 88"><path d="M0 0H100L50 88Z"/></svg>';
const CHK='<svg width="30" height="30" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#9C90D4" stroke-width="3.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const MARCA=A==='bruno'?'<span style="letter-spacing:.12em">BRUNO MAGALHÃES</span>':`POL${TRI}O<span style="margin-left:.2em">RH</span>`;
const RODAPE=A==='bruno'?'BRUNO MAGALHÃES':`POL<svg viewBox="0 0 100 88" style="height:.7em;width:.8em;fill:currentColor;margin:0 .12em -.02em"><path d="M0 0H100L50 88Z"/></svg>O RH`;
const c=document.getElementById('c');c.style.width=W+'px';c.style.height=H+'px';
document.body.style.width=W+'px';document.body.style.height=H+'px';
const st=F==='st'; if(st){document.documentElement.style.setProperty('--qf','58px');}
const topo=st?260:72, base=st?1600:H-72;
let corpo='';
if(I===0){
  corpo=`<div class="label">DEPOIMENTOS</div><h1>O que as pessoas dizem <em>depois</em> de um processo comigo</h1>
   <div class="sub">Recrutamento, carreira e cultura, nas palavras de quem viveu.</div>`;
}else if(I<=4){
  const d=D[I-1];const fs=st?190:160;
  corpo=`<div class="topo-dep"><div class="foto" style="width:${fs}px;height:${fs}px;flex:0 0 ${fs}px;background-image:url(${d.foto})"></div><span class="ctx">${d.ctx}</span></div>
   <div class="aspas">“</div><div class="quote">${d.q}</div>
   <div class="nome">${d.nome}</div><div class="cargo">${d.cargo}</div>`;
}else{
  const it=['Processo seletivo humano, com método','Headhunting com propósito','Consultoria de carreira','Clima, cultura e desenvolvimento'];
  if(!st){document.documentElement.style.setProperty('--pf','64px');document.documentElement.style.setProperty('--lf','34px');}
  corpo=`<div class="painel"><div class="label" style="color:var(--tinta)">${A==='bruno'?'BRUNO MAGALHÃES':'POLVO RH'}</div><h1>Cuidado tem método. E dá resultado.</h1>
   <div class="lista">${it.map(t=>`<div class="item"><div class="chk">${CHK}</div><div>${t}</div></div>`).join('')}</div>
   <span class="pill">${st?'ME CHAMA NO DIRECT':'VAMOS CONVERSAR?'}</span></div>
   <div class="assina">${A==='bruno'?'HR BUSINESS PARTNER · R&S, D&I, DHO E PEOPLE ANALYTICS':'CONSULTORIA DE CARREIRA E RH'}</div>`;
}
c.innerHTML=`<div class="blob"></div><div class="blob2"></div><div class="pontos"></div>
 <div class="logo" style="top:${topo}px">${MARCA}</div>
 <div class="counter" style="top:${topo}px">${String(I+1).padStart(2,'0')} / 0${N}</div>
 <div class="cont" style="top:${topo+100}px;bottom:${H-base+70}px">${corpo}</div>
 <div class="rodape" style="top:${base-20}px"><i></i><span class="marca-rod">${RODAPE}</span></div>`;
Promise.all([document.fonts.ready,...[...document.querySelectorAll('.foto')].map(()=>new Promise(r=>setTimeout(r,150)))]).then(()=>{const ct=document.querySelector('.cont');window.__ok=ct.scrollHeight<=ct.clientHeight+2;window.__ready=true});
</script></body></html>
