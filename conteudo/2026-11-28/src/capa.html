<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<!-- Capa de Reels · 1080×1920 (9:16). O grid do perfil mostra o recorte central 3:4 (1080×1440, y 240–1680):
     todo texto e logo ficam dentro de x 90–990, y 330–1590.
     3 variações, nenhuma repete a capa do carrossel:
       v=1 tipográfica (número de passos), v=2 foto (a 2ª foto do tema), v=3 checklist em fundo lavanda. -->
<style>
:root{--tinta:#13111B;--lav:#9C90D4;--lavd:#7D70B0;--lar:#F2A13A;--papel:#F9F8FB;--nevoa:#C4C0CE}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--tinta)}
body{font-family:Montserrat,sans-serif;color:var(--papel);-webkit-font-smoothing:antialiased}
#c{position:relative;width:1080px;height:1920px;overflow:hidden}
.foto{position:absolute;inset:0;background-size:cover}
.sombra{position:absolute;inset:0;background:linear-gradient(to top,rgba(19,17,27,1) 0%,rgba(19,17,27,.97) 26%,rgba(19,17,27,.55) 48%,rgba(19,17,27,.1) 66%,rgba(19,17,27,.6) 88%,rgba(19,17,27,.9) 100%)}
.glow{position:absolute;left:-300px;top:-100px;width:1100px;height:1100px;background:radial-gradient(circle,rgba(125,112,176,.5),transparent 65%)}
.glow2{position:absolute;right:-300px;bottom:100px;width:1000px;height:1000px;background:radial-gradient(circle,rgba(242,161,58,.22),transparent 65%)}
.grade{position:absolute;inset:0;background-image:linear-gradient(rgba(156,144,212,.06) 2px,transparent 2px),linear-gradient(90deg,rgba(156,144,212,.06) 2px,transparent 2px);background-size:90px 90px}
.listras{position:absolute;right:0;bottom:0;width:360px;height:360px;opacity:.5;background:repeating-linear-gradient(135deg,var(--lavd) 0 12px,transparent 12px 36px);-webkit-mask:linear-gradient(-45deg,#000 30%,transparent 62%)}
.logo{position:absolute;left:90px;top:330px;font-weight:900;font-size:40px;letter-spacing:.35em;color:var(--lav);display:flex;align-items:baseline;line-height:1}
.logo svg{height:.7em;width:.8em;margin-right:.35em;fill:currentColor}
.pill{position:absolute;right:90px;top:322px;border-radius:60px;border:3px solid var(--lav);background:rgba(19,17,27,.55);padding:10px 26px;font-weight:800;font-size:28px;letter-spacing:.14em}
.txt{position:absolute;left:90px;right:90px;bottom:330px}
.label{font-weight:800;font-size:32px;letter-spacing:.22em;color:var(--lar);margin-bottom:26px}
h1{font-weight:900;font-size:96px;line-height:1.03;letter-spacing:-.02em;text-wrap:balance}
h1.m{font-size:84px} h1.p{font-size:74px}
.assina{margin-top:32px;font-weight:800;font-size:30px;letter-spacing:.12em;color:var(--nevoa)}
/* v1 */
.big{display:flex;align-items:flex-end;gap:26px;margin-bottom:30px}
.big b{font-weight:900;font-size:330px;line-height:.78;color:var(--lar);letter-spacing:-.04em}
.big span{font-weight:900;font-size:76px;line-height:1;padding-bottom:6px}
/* v3 */
.v3{background:var(--lav)}
.v3 .logo{color:var(--tinta)} .v3 .pill{border-color:var(--tinta);background:transparent;color:var(--tinta)}
.v3 .txt{color:var(--tinta);top:450px;bottom:auto}
.v3 .label{color:var(--tinta)}
.chk{list-style:none;margin-top:50px;display:flex;flex-direction:column;gap:26px}
.chk li{display:flex;align-items:center;gap:28px;font-weight:800;font-size:46px;line-height:1.12;background:rgba(19,17,27,.1);border-radius:28px;padding:28px 30px}
.chk i{flex:0 0 76px;height:76px;border-radius:50%;background:var(--tinta);color:var(--lav);font-style:normal;font-weight:900;font-size:34px;display:flex;align-items:center;justify-content:center}
.v3 .assina{color:var(--tinta);opacity:.75}
.listras3{position:absolute;left:0;bottom:0;width:360px;height:360px;opacity:.35;background:repeating-linear-gradient(135deg,var(--tinta) 0 12px,transparent 12px 36px);-webkit-mask:linear-gradient(45deg,#000 30%,transparent 62%)}
</style></head>
<body><div id="c"></div>
<script src="content.js"></script>
<script>
const q=new URLSearchParams(location.search);const T=THEMES.find(x=>x.id==q.get('t'));const v=+(q.get('v')||1);
const M=T.motion||[];
const passos=M.filter(m=>m.type==='passo').map(m=>m.title);
const lista=passos.length?passos:((M.find(m=>m.type==='list')||{}).items||[]);
const hook=(M.find(m=>m.type==='big')||{}).title||(T.capa&&T.capa.title)||(T.carousel?T.carousel[0].title:'');
const pergunta=(M.find(m=>m.type==='cta')||{}).question||hook;
const fotoSlide=T.carousel?(T.carousel.filter(s=>s.type==='photo')[0]||T.carousel[0]):null;
const cap=T.capa||{};
const tam=(t)=>t.length>52?'p':t.length>34?'m':'';
const LOGO='<div class="logo">POL<svg viewBox="0 0 100 88"><path d="M0 0H100L50 88Z"/></svg>O</div>';
const ASS='<div class="assina">BRUNO MAGALHÃES · POLVO RH</div>';
const c=document.getElementById('c');
if(v===1){
  const n=lista.length||3;
  c.innerHTML=`<div class="glow"></div><div class="glow2"></div><div class="grade"></div><div class="listras"></div>${LOGO}<div class="pill">REEL</div>
   <div class="txt"><div class="big"><b>${n}</b><span>PASSOS<br>NA PRÁTICA</span></div><h1 class="${tam(hook)}">${hook}</h1>${ASS}</div>`;
}else if(v===2){
  const img=cap.img||(fotoSlide&&fotoSlide.img);const pos=cap.img?(cap.pos||'50% 50%'):(fotoSlide&&fotoSlide.pos)||'50% 40%';const dy=cap.img?(cap.dy||0):0;
  c.innerHTML=`<div class="foto" style="background-image:url(${img});background-position:${pos};background-size:${cap.img?'cover':'auto 135%'};top:${dy}px;bottom:${-dy}px"></div><div class="sombra"></div><div class="listras"></div>${LOGO}<div class="pill">REEL</div>
   <div class="txt"><div class="label">PASSO A PASSO</div><h1 class="${tam(hook)}">${hook}</h1>${ASS}</div>`;
}else{
  c.className='v3';
  const itens=lista.slice(0,4).map((t,i)=>`<li><i>${i+1}</i><span>${t}</span></li>`).join('');
  c.innerHTML=`<div class="listras3"></div>${LOGO}<div class="pill">REEL</div>
   <div class="txt"><div class="label">CHECKLIST</div><h1 class="${tam(pergunta)==='p'?'p':'m'}">${pergunta}</h1><ul class="chk">${itens}</ul>${ASS}</div>`;
}
document.fonts.ready.then(()=>{const tx=document.querySelector('.txt');let fs=46;while(v===3&&tx.getBoundingClientRect().bottom>1590&&fs>34){fs-=2;document.querySelectorAll('.chk li').forEach(l=>{l.style.fontSize=fs+'px';l.style.paddingBlock=(fs/2)+'px'})}const r=tx.getBoundingClientRect();window.__ok=r.top>=330&&r.bottom<=1590;window.__ready=true});
</script></body></html>
